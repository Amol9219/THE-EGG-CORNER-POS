<!doctype html>
<html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7f1d1d"><title>TEC Masala Business</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
<style>
:root{--red:#7f1d1d;--orange:#f97316;--bg:#fffaf5;--ink:#292321;--muted:#766a64;--line:#eadfd7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}header{height:64px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.logo{background:var(--orange);padding:8px 10px;border-radius:10px;font-weight:900}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:var(--red);color:white}.ghost{background:transparent;color:inherit;border:1px solid #ffffff60}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 64px)}aside{background:white;border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:5px}.nav{border:0;background:transparent;text-align:left;padding:11px;border-radius:9px;color:#58483f}.nav.active,.nav:hover{background:#fff0e6;color:var(--red);font-weight:800}.caption{font-size:10px;color:#9a8174;letter-spacing:1px;font-weight:800;padding:13px 10px 4px}main{padding:26px;max-width:1450px;width:100%;margin:auto;min-width:0}h1{font-size:clamp(26px,3vw,34px);margin:5px 0 8px}h2{font-size:19px}.muted{color:var(--muted);font-size:13px}.eyebrow{font-size:11px;letter-spacing:1px;color:var(--red);font-weight:800}.sub{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0}.metric{font-size:27px;font-weight:850;margin:9px 0}.icon{width:38px;height:38px;background:#fff0e6;border-radius:11px;display:grid;place-items:center;font-size:20px}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.notice{padding:13px 15px;border:1px solid #fed7aa;background:#fff7ed;border-radius:11px;color:#7c2d12;margin:14px 0}.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:white}table{border-collapse:collapse;width:100%;min-width:500px}th,td{text-align:left;padding:12px;border-bottom:1px solid #f1e8e1;font-size:13px}th{background:#fff7f1;color:#79594a;font-size:11px;text-transform:uppercase}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:750}.field input{border:1px solid #dfcec3;border-radius:9px;padding:11px;width:100%}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top right,#ffedd5,transparent 50%),var(--bg)}.login-card{width:min(100%,430px);background:white;border:1px solid var(--line);border-radius:20px;padding:26px}.login-card .primary{width:100%}.tag{background:#ffffff20;border:1px solid #ffffff50;border-radius:50px;padding:7px 10px;font-size:12px}.mobile{display:none}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:205px 1fr}main{padding:18px}}
@media(max-width:650px){header{height:58px;padding:0 10px}.brand{font-size:14px}.mobile{display:inline-block}.layout{display:block}aside{display:none;position:fixed;top:58px;bottom:0;left:0;width:280px;z-index:10;overflow:auto;box-shadow:0 10px 40px #0002}.layout.open aside{display:flex}main{padding:16px 12px}.grid{gap:9px}.card{padding:12px}.metric{font-size:22px}.form-grid{grid-template-columns:1fr}.tag{max-width:95px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
</style></head><body>
<div id="login-view" class="login"><form id="login-form" class="login-card"><div class="brand" style="color:var(--ink);margin-bottom:22px"><span class="logo">TEC</span><span>TEC Masala Business</span></div><div class="eyebrow">SECURE SIGN IN · सुरक्षित लॉगिन</div><p class="sub">तुमच्या व्यवसाय खात्याने लॉगिन करा.</p><div class="field"><label for="email">User ID / Email</label><input id="email" type="email" autocomplete="username" placeholder="तुमचा ईमेल" required></div><div class="field"><label for="password">Password / पासवर्ड</label><input id="password" type="password" autocomplete="current-password" required></div><button id="login-submit" class="btn primary">लॉगिन करा</button><div id="login-message" class="notice hidden"></div><p class="muted">Default password नाही. Owner/Admin ने Supabase Auth मध्ये खाते तयार केल्यानंतरच लॉगिन करता येईल.</p></form></div>
<div id="app-view" class="hidden"><header><div class="brand"><button class="btn ghost mobile" id="menu-toggle">☰</button><span class="logo">TEC</span><span>TEC Masala Business</span></div><div style="display:flex;gap:10px;align-items:center"><span id="user-tag" class="tag"></span><button id="logout" class="btn ghost">Logout</button></div></header><div id="layout" class="layout"><aside>
<div class="caption">OVERVIEW</div><button class="nav active" data-page="dashboard">▦ Dashboard</button><button class="nav" data-page="notifications">♢ Notifications</button>
<div class="caption">INVENTORY</div><button class="nav" data-page="raw" data-roles="owner">◫ Raw Materials</button><button class="nav" data-page="stock">▤ Stock & Batches</button><button class="nav" data-page="production" data-roles="owner">⚙ Production</button><button class="nav" data-page="products">▣ Products & Prices</button>
<div class="caption">OPERATIONS</div><button class="nav" data-page="orders">⇄ Outlet Orders</button><button class="nav" data-page="suppliers" data-roles="owner">♧ Suppliers & Purchases</button><button class="nav" data-page="receipts" data-roles="owner">✓ Goods Receipt & Quality</button><button class="nav" data-page="returns">↶ Returns / Damage</button><button class="nav" data-page="bills">▧ Bills & Payments</button>
<div class="caption">MANAGEMENT</div><button class="nav" data-page="reports" data-roles="owner,co_owner">▥ Reports</button><button class="nav" data-page="audit" data-roles="owner">≡ User Activity Log</button><button class="nav" data-page="outlets" data-roles="owner">⌂ Outlets</button><button class="nav" data-page="users" data-roles="owner">♙ Users & Roles</button><button class="nav" data-page="settings" data-roles="owner">⚙ Settings</button>
<div class="muted" style="margin-top:auto;padding:14px 8px;border-top:1px solid var(--line)">TEC Masala Business · Foundation</div></aside><main id="main"><div class="muted">Loading…</div></main></div></div>
<script>
(()=> {
 const URL="https://isypmwpmqqcopgcmenqz.supabase.co", KEY="sb_publishable_aTL-fgjwDQ-JBnywzR0KEg_ONWEjEAw";
 const db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
 let user=null,profile=null;
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const roleTitle={owner:"Owner",co_owner:"Co-Owner",outlet:"Outlet"};
 const allowed=roles=>roles.includes(profile?.role);
 const message=(el,text,cls="")=>{el.textContent=text;el.className="notice "+cls;el.classList.remove("hidden")};
 function header(k,t,d){return '<div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="sub">'+d+'</p>'}
 function card(i,t,v,d){return '<div class="card"><div class="icon">'+i+'</div><div class="muted" style="margin-top:12px">'+t+'</div><div class="metric">'+v+'</div><div class="muted">'+d+'</div></div>'}
 function table(head,rows){return '<div class="table-wrap"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+head.length+'" style="padding:28px;text-align:center;color:#766a64">अजून नोंदी नाहीत.</td></tr>')+'</tbody></table></div>'}
 async function count(name){const {count,error}=await db.from(name).select("*",{count:"exact",head:true});if(error)throw error;return count||0}
 async function rows(name,cols){const {data,error}=await db.from(name).select(cols).limit(100);if(error)throw error;return data||[]}
 async function start(u){
  user=u;const {data,error}=await db.from("profiles").select("id,full_name,role,outlet_id,is_active").eq("id",u.id).maybeSingle();
  if(error||!data||!data.is_active){await db.auth.signOut();$("login-view").classList.remove("hidden");$("app-view").classList.add("hidden");message($("login-message"),error?error.message:"या खात्यासाठी सक्रिय profile नाही. Owner कडून setup करून घ्या.","error");return}
  profile=data;$("login-view").classList.add("hidden");$("app-view").classList.remove("hidden");$("user-tag").textContent=(profile.full_name||u.email)+" · "+(roleTitle[profile.role]||"");document.querySelectorAll(".nav[data-roles]").forEach(b=>b.classList.toggle("hidden",!allowed(b.dataset.roles.split(","))));await page("dashboard")
 }
 $("login-form").addEventListener("submit",async e=>{e.preventDefault();const b=$("login-submit");b.disabled=true;b.textContent="लॉगिन होत आहे…";$("login-message").classList.add("hidden");try{const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw error;await start(data.user)}catch(err){message($("login-message"),"लॉगिन झाले नाही. तपशील तपासा. "+err.message,"error")}finally{b.disabled=false;b.textContent="लॉगिन करा"}});
 $("logout").onclick=async()=>{await db.auth.signOut();profile=null;user=null;$("app-view").classList.add("hidden");$("login-view").classList.remove("hidden");$("password").value=""};
 $("menu-toggle").onclick=()=>$("layout").classList.toggle("open");
 document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{if(b.classList.contains("hidden"))return;document.querySelectorAll(".nav").forEach(n=>n.classList.remove("active"));b.classList.add("active");$("layout").classList.remove("open");page(b.dataset.page)});
 async function page(which){const root=$("main");root.innerHTML='<div class="muted">Loading…</div>';try{
 if(which==="dashboard"){const [p,r,o,s,orders,bills]=await Promise.all([count("products"),profile.role==="owner"?count("raw_materials"):Promise.resolve("—"),count("outlets"),profile.role==="owner"?count("suppliers"):Promise.resolve("—"),count("outlet_orders"),count("bills")]);root.innerHTML=header("BUSINESS OVERVIEW","नमस्कार, "+esc(profile.full_name||roleTitle[profile.role]),"TEC Masala Business — व्यवसायाची सद्यस्थिती")+'<div class="grid">'+card("▣","Products",p,"उत्पादने")+card("◫","Raw Materials",r,"कच्चा माल")+card("⌂","Outlets",o,"Active outlet records")+card("♧","Suppliers",s,"Supplier records")+'</div><div class="section"><h2>Operations snapshot</h2><span class="muted">Live database counts</span></div><div class="grid">'+card("⇄","Outlet Orders",orders,"Order records")+card("▧","Bills",bills,"Bill records")+card("♢","Notifications","—","In-app alerts")+card("✓","Security","RLS","Row-level policies")+'</div><div class="notice">हे पहिल्या टप्प्याचे foundation आहे. सर्व modules पूर्ण झाल्याचा दावा नाही; stock approvals, billing workflows आणि reports पुढील टप्प्यांत जोडले जातील.</div>'}
 else if(which==="raw"){if(!allowed(["owner"]))throw Error("Owner permission आवश्यक आहे.");const data=await rows("raw_materials","id,name,unit,current_stock,min_stock,target_stock,is_active");root.innerHTML=header("INVENTORY","Raw Materials","कच्च्या मालाची नोंद आणि साठा")+'<div class="card"><h2>कच्चा माल जोडा</h2><form id="add-form"><div class="form-grid">'+[['name','नाव','text'],['unit','Unit (kg, g, litre, pcs)','text'],['current_stock','Opening stock','number'],['min_stock','Low stock threshold','number'],['target_stock','Target stock','number']].map(f=>'<div class="field"><label>'+f[1]+'</label><input name="'+f[0]+'" type="'+f[2]+'" '+(f[0]==="name"||f[0]==="unit"?"required":"")+' '+(f[2]==="number"?'min="0" step="0.001"':'')+'></div>').join("")+'</div><button class="btn primary">नोंद जतन करा</button></form><div id="save-msg" class="notice hidden"></div></div><div class="section"><h2>नोंदवलेला कच्चा माल</h2></div>'+table(["Name","Unit","Available","Min","Target","Status"],data.map(x=>[esc(x.name),esc(x.unit),esc(x.current_stock),esc(x.min_stock),esc(x.target_stock),x.is_active?"Active":"Inactive"]));$("add-form").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const payload={name:String(f.get("name")).trim(),unit:String(f.get("unit")).trim(),current_stock:Number(f.get("current_stock")||0),min_stock:Number(f.get("min_stock")||0),target_stock:Number(f.get("target_stock")||0)};const {error}=await db.from("raw_materials").insert(payload);if(error)message($("save-msg"),"जतन झाले नाही: "+error.message,"error");else{message($("save-msg"),"नोंद जतन झाली.","ok");page("raw")}}}
 else if(which==="products"){const data=await rows("products","id,name,unit,pack_size,current_stock,min_stock,is_active");root.innerHTML=header("CATALOGUE","Products & Prices","उत्पादने, पॅकिंग आणि उपलब्धता")+(allowed(["owner"])?'<div class="card"><h2>उत्पादन जोडा</h2><form id="add-form"><div class="form-grid">'+[['name','Product name','text'],['unit','Unit','text'],['pack_size','Pack size','text'],['current_stock','Opening stock','number'],['min_stock','Low stock threshold','number']].map(f=>'<div class="field"><label>'+f[1]+'</label><input name="'+f[0]+'" type="'+f[2]+'" '+(f[0]==="name"||f[0]==="unit"?'required':'')+' '+(f[2]==="number"?'min="0" step="0.001"':'')+'></div>').join("")+'</div><button class="btn primary">जतन करा</button></form><div id="save-msg" class="notice hidden"></div></div>':'')+'<div class="section"><h2>उत्पादन सूची</h2></div>'+table(["Product","Pack","Unit","Stock","Min stock","Status"],data.map(x=>[esc(x.name),esc(x.pack_size||"—"),esc(x.unit),esc(x.current_stock),esc(x.min_stock),x.is_active?"Active":"Inactive"]));const form=$("add-form");if(form)form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form);const payload={name:String(f.get("name")).trim(),unit:String(f.get("unit")).trim(),pack_size:f.get("pack_size")||null,current_stock:Number(f.get("current_stock")||0),min_stock:Number(f.get("min_stock")||0),product_type:"finished"};const {error}=await db.from("products").insert(payload);if(error)message($("save-msg"),"जतन झाले नाही: "+error.message,"error");else page("products")}}
 else if(which==="outlets"){if(!allowed(["owner"]))throw Error("Owner permission आवश्यक आहे.");const data=await rows("outlets","id,name,code,mobile,address,is_active");root.innerHTML=header("NETWORK","Outlets","आउटलेटची माहिती व्यवस्थापित करा")+'<div class="card"><h2>आउटलेट जोडा</h2><form id="add-form"><div class="form-grid">'+[['name','Outlet name'],['code','Code'],['mobile','Mobile'],['address','Address']].map(f=>'<div class="field"><label>'+f[1]+'</label><input name="'+f[0]+'" '+(f[0]==="name"?"required":"")+'></div>').join("")+'</div><button class="btn primary">जतन करा</button></form><div id="save-msg" class="notice hidden"></div></div><div class="section"><h2>Outlets</h2></div>'+table(["Name","Code","Mobile","Address","Status"],data.map(x=>[esc(x.name),esc(x.code||"—"),esc(x.mobile||"—"),esc(x.address||"—"),x.is_active?"Active":"Inactive"]));$("add-form").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from("outlets").insert({name:String(f.get("name")).trim(),code:f.get("code")||null,mobile:f.get("mobile")||null,address:f.get("address")||null});if(error)message($("save-msg"),"जतन झाले नाही: "+error.message,"error");else page("outlets")}}
 else if(which==="stock"){const data=await rows("inventory_batches","id,item_kind,batch_code,received_qty,available_qty,unit,expires_on,quality_status");root.innerHTML=header("INVENTORY","Stock & Batches","Batch-wise stock, expiry आणि FIFO overview")+'<div class="notice">साठा थेट edit केलेला नाही. पुढील टप्प्यात stock changes फक्त receipt, production किंवा Owner-approved adjustment मधून होतील.</div>'+table(["Batch","Type","Received","Available","Unit","Expiry","Quality"],data.map(x=>[esc(x.batch_code),esc(x.item_kind),esc(x.received_qty),esc(x.available_qty),esc(x.unit),esc(x.expires_on||"—"),esc(x.quality_status)]))}
 else if(which==="notifications"){const data=await rows("app_notifications","id,title,message,notification_type,read_at,created_at");root.innerHTML=header("INBOX","Notifications","तुमच्यासाठी असलेल्या सूचना")+table(["Title","Message","Type","Status"],data.map(x=>[esc(x.title),esc(x.message),esc(x.notification_type),x.read_at?"Read":"Unread"]))}
 else {const p={production:["PRODUCTION","Production","Recipe/BOM आणि raw material consumption पुढील टप्प्यात."],orders:["SALES OPERATIONS","Outlet Orders","Order approval, delivery आणि outlet-specific prices पुढील टप्प्यात."],suppliers:["PROCUREMENT","Suppliers & Purchases","Supplier master, PO numbering, rates आणि approval पुढील टप्प्यात."],receipts:["QUALITY","Goods Receipt & Quality","Partial receipt, batch tracking आणि quality inspection पुढील टप्प्यात."],returns:["AFTER-SALES","Returns / Damage","Outlet complaint आणि Owner approval workflow पुढील टप्प्यात."],bills:["FINANCE","Bills & Payments","Immutable bills, payment approval आणि balance tracking पुढील टप्प्यात."],reports:["REPORTS","Reports","Owner reports आणि Co-Owner monthly summary पुढील टप्प्यात."],audit:["SECURITY","User Activity Log","Immutable audit events पुढील टप्प्यात."],users:["ACCESS CONTROL","Users & Roles","Auth users आणि profiles सुरक्षितपणे जोडण्यासाठी Owner setup आवश्यक आहे."],settings:["CONFIGURATION","Settings","Business profile, logo, backup आणि restore safeguards पुढील टप्प्यात."]}[which]||["TEC MASALA","Module","या विभागावर काम सुरू आहे."];root.innerHTML=header(p[0],p[1],p[2])+'<div class="card"><div class="icon">⚙</div><h2 style="margin-top:14px">Module foundation</h2><p class="muted">या module चे database tables तयार आहेत. Validated forms, approval workflow, transactional stock updates, audit logging आणि role-isolation tests पुढील टप्प्यांत जोडले जातील. हा विभाग सध्या final transactions लिहीत नाही.</p></div>'}
 }catch(err){root.innerHTML=header("ACCESS / DATA","हा विभाग उघडता आला नाही","डेटा किंवा permission तपासा.")+'<div class="notice error">'+esc(err.message)+'</div><button class="btn primary" id="retry">पुन्हा प्रयत्न करा</button>';$("retry").onclick=()=>page(which)}}
 db.auth.onAuthStateChange((event,session)=>{if(session?.user&&!profile)setTimeout(()=>start(session.user),0);if(!session?.user&&event==="SIGNED_OUT"){profile=null;user=null}});
 db.auth.getSession().then(({data})=>{if(data.session?.user)start(data.session.user)});
})();
</script></body></html>

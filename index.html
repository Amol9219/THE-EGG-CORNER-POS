 (lowProducts.length?'<div class="section"><h2>Products needing attention</h2></div>'+table(["Product","Current stock","Minimum"],lowProducts.map(x=>[esc(x.name),esc(x.current_stock),esc(x.min_stock)])):"")+
 (profile.role==="owner"&&lowRaw.length?'<div class="section"><h2>Raw materials needing attention</h2></div>'+table(["Raw material","Current stock","Minimum"],lowRaw.map(x=>[esc(x.name),esc(x.current_stock),esc(x.min_stock)])):"");
}
else if(which==="users"){
 if(!allowed(["owner"]))throw Error("Owner permission आवश्यक आहे.");
 const [people,outlets]=await Promise.all([rows("profiles","id,full_name,mobile,role,outlet_id,is_active,created_at"),rows("outlets","id,name")]);
 const om=Object.fromEntries(outlets.map(x=>[x.id,x.name]));
 const roles={owner:"Owner",co_owner:"Co-Owner",outlet:"Outlet"};
 root.innerHTML=header("ACCESS CONTROL","Users & Roles","लॉगिन प्रोफाइल, भूमिका आणि सक्रिय स्थिती")+
 '<div class="notice">सुरक्षिततेसाठी इथे Auth password किंवा secret दाखवला जात नाही. नवीन व्यक्तीचा login आधी Supabase Authentication → Users मध्ये तयार करा; त्यानंतरच matching profile जोडा. सध्या हा विभाग read-only आहे.</div>'+
 '<div class="grid">'+card("users","User profiles",people.length,"Profiles नोंदी")+
 card("shield-check","Active profiles",people.filter(x=>x.is_active).length,"लॉगिनसाठी सक्रिय")+
 card("store","Outlet users",people.filter(x=>x.role==="outlet").length,"Outlet भूमिका")+
 card("users","Co-owners",people.filter(x=>x.role==="co_owner").length,"Co-Owner भूमिका")+'</div>'+
 '<div class="section"><h2>Profile directory</h2><span class="muted">Login email हा Auth मध्येच पाहता येतो.</span></div>'+
 table(["Name","Mobile","Role","Assigned outlet","Status","Created"],people.map(x=>[esc(x.full_name||"—"),esc(x.mobile||"—"),esc(roles[x.role]||x.role||"—"),esc(om[x.outlet_id]||"—"),x.is_active?'<span style="color:#047857;font-weight:700">Active</span>':'<span style="color:#b91c1c;font-weight:700">Inactive</span>',x.created_at?new Date(x.created_at).toLocaleDateString("en-IN"):"—"]));
}
else if(which==="audit"){
 if(!allowed(["owner"]))throw Error("Owner permission आवश्यक आहे.");
 const [logRes,people]=await Promise.all([
  db.from("audit_log").select("id,actor_user_id,action,entity_type,entity_id,reason,created_at").order("created_at",{ascending:false}).limit(100),
  rows("profiles","id,full_name,role")
 ]);
 if(logRes.error)throw logRes.error;
 const actorNames=Object.fromEntries(people.map(x=>[x.id,(x.full_name||"User")+" · "+(x.role||"")]));
 const logs=logRes.data||[];
 root.innerHTML=header("SECURITY","User Activity Log","नोंदवलेली audit activity — read-only")+
 '<div class="notice">इथे database मध्ये लिहिलेल्या audit entries दिसतात. सर्व modules मध्ये audit logging अजून जोडलेले नसल्याने हा पूर्ण system-wide activity log नाही.</div>'+
 '<div class="grid">'+card("history","Audit entries",logs.length,"अलीकडील जास्तीत जास्त 100")+
 card("users","Actors",new Set(logs.map(x=>x.actor_user_id).filter(Boolean)).size,"नोंदी करणारे Users")+'</div>'+
 '<div class="section"><h2>Recent activity</h2></div>'+
 table(["When","Actor","Action","Entity","Reference","Reason"],logs.map(x=>[x.created_at?new Date(x.created_at).toLocaleString("en-IN"):"—",esc(actorNames[x.actor_user_id]||"System / unknown"),esc(x.action||"—"),esc(x.entity_type||"—"),esc(x.entity_id||"—"),esc(x.reason||"—")]));
}
else {const p={production:["PRODUCTION","Production","Recipe/BOM आणि raw material consumption पुढील टप्प्यात."],orders:["SALES OPERATIONS","Outlet Orders","Order approval, delivery आणि outlet-specific prices पुढील टप्प्यात."],suppliers:["PROCUREMENT","Suppliers & Purchases","Supplier master, PO numbering, rates आणि approval पुढील टप्प्यात."],receipts:["QUALITY","Goods Receipt & Quality","Partial receipt, batch tracking आणि quality inspection पुढील टप्प्यात."],returns:["AFTER-SALES","Returns / Damage","Outlet complaint आणि Owner approval workflow पुढील टप्प्यात."],bills:["FINANCE","Bills & Payments","Immutable bills, payment approval आणि balance tracking पुढील टप्प्यात."],reports:["REPORTS","Reports","Owner reports आणि Co-Owner monthly summary पुढील टप्प्यात."],audit:["SECURITY","User Activity Log","Immutable audit events पुढील टप्प्यात."],users:["ACCESS CONTROL","Users & Roles","Auth users आणि profiles सुरक्षितपणे जोडण्यासाठी Owner setup आवश्यक आहे."],settings:["CONFIGURATION","Settings","Business profile, logo, backup आणि restore safeguards पुढील टप्प्यात."]}[which]||["TEC MASALA","Module","या विभागावर काम सुरू आहे."];root.innerHTML=header(p[0],p[1],p[2])+'<div class="card"><div class="icon">⚙</div><h2 style="margin-top:14px">Module foundation</h2><p class="muted">या module चे database tables तयार आहेत. Validated forms, approval workflow, transactional stock updates, audit logging आणि role-isolation tests पुढील टप्प्यांत जोडले जातील. हा विभाग सध्या final transactions लिहीत नाही.</p></div>'}
 }catch(err){root.innerHTML=header("ACCESS / DATA","हा विभाग उघडता आला नाही","डेटा किंवा permission तपासा.")+'<div class="notice error">'+esc(err.message)+'</div><button class="btn primary" id="retry">पुन्हा प्रयत्न करा</button>';$("retry").onclick=()=>page(which)}}
 db.auth.onAuthStateChange((event,session)=>{if(session?.user&&!profile)setTimeout(()=>start(session.user),0);if(!session?.user&&event==="SIGNED_OUT"){profile=null;user=null}});
 db.auth.getSession().then(({data})=>{if(data.session?.user)start(data.session.user)});
})();
